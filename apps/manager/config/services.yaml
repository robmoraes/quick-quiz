parameters:
  openai.empty: ''
  manager.default_version: '0.5.0'
  manager.default_api_base_url: 'http://127.0.0.1:8080'
  manager.default_api_timeout: 3
  manager.default_ads_api_base_url: 'http://127.0.0.1:8084'
  manager.default_ads_api_timeout: 5
  manager.default_content_storage_provider: 'local'
  manager.default_aws_region: 'us-east-1'
  manager.default_s3_prefix: 'questions'
  manager.default_s3_force_path_style: false
  manager.default_session_redis_dsn: 'redis://127.0.0.1:6379/1'
  manager.default_session_ttl: 3600
  manager.default_session_prefix: 'quickquiz:manager:session:'
  manager.default_trusted_proxies: '127.0.0.1,REMOTE_ADDR'
  manager.default_admin_api_token: ''
  openai.default_base_url: 'https://api.openai.com/v1'
  openai.default_timeout: 45
  openai.default_models_timeout: 15
  manager.api_base_url: '%env(default:manager.default_api_base_url:QUICKQUIZ_API_BASE_URL)%'
  manager.api_timeout: '%env(int:default:manager.default_api_timeout:QUICKQUIZ_API_TIMEOUT)%'
  manager.ads_api_base_url: '%env(default:manager.default_ads_api_base_url:QUICKQUIZ_ADS_API_BASE_URL)%'
  manager.ads_api_timeout: '%env(int:default:manager.default_ads_api_timeout:QUICKQUIZ_ADS_API_TIMEOUT)%'
  manager.content_storage_provider: '%env(default:manager.default_content_storage_provider:MANAGER_CONTENT_STORAGE_PROVIDER)%'
  manager.aws_region: '%env(default:manager.default_aws_region:AWS_REGION)%'
  manager.s3_bucket: '%env(default:openai.empty:S3_BUCKET)%'
  manager.s3_prefix: '%env(default:manager.default_s3_prefix:S3_PREFIX)%'
  manager.s3_endpoint_url: '%env(default:openai.empty:S3_ENDPOINT_URL)%'
  manager.s3_force_path_style: '%env(bool:default:manager.default_s3_force_path_style:S3_FORCE_PATH_STYLE)%'
  manager.session_redis_dsn: '%env(default:manager.default_session_redis_dsn:MANAGER_SESSION_REDIS_DSN)%'
  manager.session_ttl: '%env(int:default:manager.default_session_ttl:MANAGER_SESSION_TTL)%'
  manager.session_prefix: '%env(default:manager.default_session_prefix:MANAGER_SESSION_PREFIX)%'
  manager.trusted_proxies: '%env(csv:default:manager.default_trusted_proxies:TRUSTED_PROXIES)%'
  manager.admin_api_token: '%env(default:manager.default_admin_api_token:MANAGER_ADMIN_API_TOKEN)%'
  manager.database_url: '%env(MANAGER_DATABASE_URL)%'
  manager.content_root: '%env(MANAGER_CONTENT_ROOT)%'
  manager.fallback_locale: '%env(FALLBACK_LOCALE)%'
  manager.supported_locales: '%env(SUPPORTED_LOCALES)%'
  manager.version: '%env(default:manager.default_version:MANAGER_VERSION)%'
  manager.run_question_limit: '%env(int:default:manager.default_run_question_limit:RUN_QUESTION_LIMIT)%'
  manager.default_run_question_limit: 10
  openai.api_key: '%env(default:openai.empty:OPENAI_API_KEY)%'
  openai.base_url: '%env(default:openai.default_base_url:OPENAI_BASE_URL)%'
  openai.timeout: '%env(int:default:openai.default_timeout:OPENAI_TIMEOUT)%'
  openai.models_timeout: '%env(int:default:openai.default_models_timeout:OPENAI_MODELS_TIMEOUT)%'
  openai.model: '%env(default:openai.empty:OPENAI_MODEL)%'
  openai.project: '%env(default:openai.empty:OPENAI_PROJECT)%'
  openai.org_id: '%env(default:openai.empty:OPENAI_ORG_ID)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'

  App\Storage\ContentStorage:
    factory: ['App\Storage\ContentStorageFactory', 'create']
    arguments:
      $provider: '%manager.content_storage_provider%'
      $contentRoot: '%manager.content_root%'
      $region: '%manager.aws_region%'
      $bucket: '%manager.s3_bucket%'
      $prefix: '%manager.s3_prefix%'
      $endpointUrl: '%manager.s3_endpoint_url%'
      $forcePathStyle: '%manager.s3_force_path_style%'

  manager.session_redis:
    class: Predis\Client
    arguments:
      - '%manager.session_redis_dsn%'

  Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
    arguments:
      $redis: '@manager.session_redis'
      $options:
        prefix: '%manager.session_prefix%'
        ttl: '%manager.session_ttl%'

  App\Repository\AdminRepository:
    arguments:
      $databaseUrl: '%manager.database_url%'

  App\Repository\AiPromptRepository:
    arguments:
      $databaseUrl: '%manager.database_url%'

  App\Service\QuizPackService:
    arguments:
      $contentRoot: '%manager.content_root%'
      $fallbackLocale: '%manager.fallback_locale%'
      $supportedLocales: '%manager.supported_locales%'
      $themeContext: '@App\Service\ThemeContext'
      $runQuestionLimit: '%manager.run_question_limit%'
      $contentStorage: '@App\Storage\ContentStorage'

  App\Security\AdminApiTokenAuthenticator:
    arguments:
      $token: '%manager.admin_api_token%'

  App\Service\AdService:
    arguments:
      $contentRoot: '%manager.content_root%'
      $adsApiBaseUrl: '%manager.ads_api_base_url%'
      $requestTimeout: '%manager.ads_api_timeout%'
      $contentStorage: '@App\Storage\ContentStorage'

  App\Service\ApiSessionMonitor:
    arguments:
      $apiBaseUrl: '%manager.api_base_url%'
      $requestTimeout: '%manager.api_timeout%'

  App\Service\AiPromptExportService:
    arguments:
      $contentRoot: '%manager.content_root%'
      $contentStorage: '@App\Storage\ContentStorage'

  App\Service\OpenAiModelProvider:
    arguments:
      $apiKey: '%openai.api_key%'
      $defaultModel: '%openai.model%'
      $project: '%openai.project%'
      $organization: '%openai.org_id%'
      $baseUrl: '%openai.base_url%'
      $requestTimeout: '%openai.models_timeout%'

  App\Service\OpenAiQuestionLocalizer:
    arguments:
      $apiKey: '%openai.api_key%'
      $model: '%openai.model%'
      $project: '%openai.project%'
      $organization: '%openai.org_id%'
      $aiPrompts: '@App\Service\AiPromptProvider'
      $modelProvider: '@App\Service\OpenAiModelProvider'
      $baseUrl: '%openai.base_url%'
      $requestTimeout: '%openai.timeout%'

  App\Service\QuestionLocalizer: '@App\Service\OpenAiQuestionLocalizer'

  App\Service\OpenAiCatalogAssistant:
    arguments:
      $apiKey: '%openai.api_key%'
      $model: '%openai.model%'
      $project: '%openai.project%'
      $organization: '%openai.org_id%'
      $aiPrompts: '@App\Service\AiPromptProvider'
      $modelProvider: '@App\Service\OpenAiModelProvider'
      $baseUrl: '%openai.base_url%'
      $requestTimeout: '%openai.timeout%'

  App\Service\CatalogAssistant: '@App\Service\OpenAiCatalogAssistant'

  App\Service\OpenAiConfiguration:
    arguments:
      $apiKey: '%openai.api_key%'
      $model: '%openai.model%'
      $modelProvider: '@App\Service\OpenAiModelProvider'

  App\Service\ManagerVersion:
    arguments:
      $version: '%manager.version%'

  App\Service\OpenAiQuestionRecommender:
    arguments:
      $apiKey: '%openai.api_key%'
      $model: '%openai.model%'
      $project: '%openai.project%'
      $organization: '%openai.org_id%'
      $aiPrompts: '@App\Service\AiPromptProvider'
      $modelProvider: '@App\Service\OpenAiModelProvider'
      $baseUrl: '%openai.base_url%'
      $requestTimeout: '%openai.timeout%'

  App\Service\QuestionRecommender: '@App\Service\OpenAiQuestionRecommender'
