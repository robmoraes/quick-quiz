              type: string
              example: Invalid input

    DiscoveryIdentifier:
      type: string
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      description: Existing canonical identifier format; retain its case and punctuation.
    DiscoveryLocale:
      type: string
      minLength: 2
      maxLength: 35
      example: pt-BR
    DiscoveryTagInput:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^[ \t\r\n\f\v]*[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*[ \t\r\n\f\v]*$
    DiscoveryTag:
      type: string
      minLength: 1
      maxLength: 50
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      description: Canonical stored slug; friendly localized labels belong to the Web i18n registry.
      example: seguranca
    DiscoveryTags:
      type: array
      maxItems: 20
      uniqueItems: true
      description: Complete tag set for this resource, sorted by ASCII slug; never null or omitted.
      items:
        $ref: '#/components/schemas/DiscoveryTag'
    DiscoveryDifficulty:
      type: integer
      format: int32
      enum:
      - 1
      - 2
      - 3
      - 4
      description: Existing values 1=easy, 2=normal, 3=hard, 4=hardcore.
    DiscoveryDifficultyCount:
      type: object
      required:
      - id
      - questionCount
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DiscoveryDifficulty'
        questionCount:
          type: integer
          format: int64
          minimum: 1
          description: Distinct canonical packages at this difficulty in the response's filter scope.
    DiscoveryDifficulties:
      type: array
      maxItems: 4
      description: Only populated difficulties, ordered by numeric ID without duplicate IDs. Empty when questionCount
        is zero. Counts sum exactly to questionCount. With a difficulty filter this array contains at most
        that one difficulty.
      items:
        $ref: '#/components/schemas/DiscoveryDifficultyCount'
    DiscoveryThemeIdentity:
      type: object
      required:
      - id
      - name
      - description
      - weight
      - tags
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DiscoveryIdentifier'
        name:
          type: string
          minLength: 1
          description: Canonical theme name; theme translations are outside this feature.
        description:
          type: string
          description: Canonical theme description; may be empty.
        weight:
          type: integer
          format: int32
        tags:
          $ref: '#/components/schemas/DiscoveryTags'
    DiscoveryTheme:
      type: object
      required:
      - id
      - name
      - description
      - weight
      - tags
      - topicCount
      - playableTopicCount
      - questionCount
      - difficulties
      - playable
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/DiscoveryIdentifier'
        name:
          type: string
          minLength: 1
          description: Canonical theme name; not translated by this feature.
        description:
          type: string
          description: Canonical theme description; may be empty.
        weight:
          type: integer
          format: int32
        tags:
          $ref: '#/components/schemas/DiscoveryTags'
        topicCount:
          type: integer
          format: int64
          minimum: 0
          description: Distinct matching active topics, including empty topics when difficulty is absent.
        playableTopicCount:
          type: integer
          format: int64
          minimum: 0
          description: Matching topics with at least one scoped canonical question; never greater than topicCount.
        questionCount:
          type: integer
          format: int64
          minimum: 0
          description: Scoped distinct canonical question keys among matching active descendant topics.
        difficulties:
          $ref: '#/components/schemas/DiscoveryDifficulties'
        playable:
          type: boolean
          description: True exactly when scoped questionCount is greater than zero; does not promise session
            availability.
    DiscoveryTopic:
      type: object
      required:
      - theme
      - id
      - label
      - description
      - weight
      - tags
      - questionCount
      - difficulties
      - playable
      additionalProperties: false
      properties:
        theme:
          $ref: '#/components/schemas/DiscoveryThemeIdentity'
        id:
          $ref: '#/components/schemas/DiscoveryIdentifier'
        label:
          type: string
          minLength: 1
          description: Existing requested/fallback/canonical topic-name resolution.
        description:
          type: string
          description: Existing requested/fallback/canonical description resolution; may be empty.
        weight:
          type: integer
          format: int32
        tags:
          $ref: '#/components/schemas/DiscoveryTags'
        questionCount:
          type: integer
          format: int64
          minimum: 0
          description: Distinct canonical question keys in this topic and selected difficulty scope.
        difficulties:
          $ref: '#/components/schemas/DiscoveryDifficulties'
        playable:
          type: boolean
          description: True exactly when scoped questionCount is greater than zero; session exhaustion is
            not considered.
    DiscoveryTagCounts:
      type: object
      required:
      - slug
      - themeCount
      - topicCount
      - questionCount
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/DiscoveryTag'
        themeCount:
          type: integer
          format: int64
          minimum: 1
          description: Distinct eligible active parent themes under all supplied filters and this candidate
            tag.
        topicCount:
          type: integer
          format: int64
          minimum: 0
          description: Distinct eligible active theme/topic pairs under all supplied filters and this candidate
            tag.
        questionCount:
          type: integer
          format: int64
          minimum: 0
          description: Scoped distinct canonical packages; never counts translations, answers or inactive
            resources.
    DiscoveryPagination:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      additionalProperties: false
      description: total is the number of matching top-level resources before pagination; totalPages is ceil(total/pageSize),
        or zero for no matches. page and pageSize echo resolved defaults/validated inputs. Each request is
        internally consistent, but separate pages may observe intervening content edits; no cross-request
        snapshot cursor is promised.
      properties:
        page:
          type: integer
          minimum: 1
          maximum: 1000
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int64
          minimum: 0
    DiscoveryThemePage:
      type: object
      required:
      - locale
      - fallbackLocale
      - themes
      - pagination
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/DiscoveryLocale'
        fallbackLocale:
          $ref: '#/components/schemas/DiscoveryLocale'
        themes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryTheme'
        pagination:
          $ref: '#/components/schemas/DiscoveryPagination'
    DiscoveryThemeDetail:
      type: object
      required:
      - locale
      - fallbackLocale
      - theme
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/DiscoveryLocale'
        fallbackLocale:
          $ref: '#/components/schemas/DiscoveryLocale'
        theme:
          $ref: '#/components/schemas/DiscoveryTheme'
    DiscoveryTopicPage:
      type: object
      required:
      - locale
      - fallbackLocale
      - topics
      - pagination
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/DiscoveryLocale'
        fallbackLocale:
          $ref: '#/components/schemas/DiscoveryLocale'
        topics:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryTopic'
        pagination:
          $ref: '#/components/schemas/DiscoveryPagination'
    DiscoveryTopicDetail:
      type: object
      required:
      - locale
      - fallbackLocale
      - topic
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/DiscoveryLocale'
        fallbackLocale:
          $ref: '#/components/schemas/DiscoveryLocale'
        topic:
          $ref: '#/components/schemas/DiscoveryTopic'
    DiscoveryTagPage:
      type: object
      required:
      - locale
      - fallbackLocale
      - scope
      - tags
      - pagination
      additionalProperties: false
      properties:
        locale:
          $ref: '#/components/schemas/DiscoveryLocale'
        fallbackLocale:
          $ref: '#/components/schemas/DiscoveryLocale'
        scope:
          type: string
          enum:
          - theme
          - topic
        tags:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryTagCounts'
        pagination:
          $ref: '#/components/schemas/DiscoveryPagination'
    DiscoveryErrorResponse:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - invalid_query
              - invalid_tag
              - invalid_locale
              - theme_not_found
              - topic_not_found
              - discovery_unavailable
              - storage_unavailable
              - internal_error
              description: Stable machine-readable error code; never localized.
            message:
              type: string
              description: Nonlocalized summary without SQL, credentials, question data or infrastructure
                internals.

  responses:
    InvalidInput:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RunNotFound:
      description: Run not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QuestionNotFound:
      description: Question not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SolutionForbidden:
      description: Solution is only available for questions that were answered incorrectly in the requested run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SolutionRateLimited:
      description: Solution request limit reached for the requested run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoQuestionsLeft:
      description: No questions available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SolutionUnavailable:
      description: Solution generator is unavailable or failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DiscoveryInvalidQuery:
      description: invalid_locale for a missing, repeated, malformed or unsupported locale; invalid_tag for
        malformed/repeated tag filters; invalid_query for other malformed, empty, repeated or unsupported
        query parameters/path IDs. Unknown query parameter names are rejected, not silently ignored. Every
        parameter is single-valued; arrays and repeated keys are unsupported.
      headers:
        Cache-Control:
          $ref: '#/components/headers/DiscoveryNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryErrorResponse'
          example:
            error:
              code: invalid_query
              message: Invalid discovery query
    DiscoveryNotFound:
      description: theme_not_found for a missing/inactive parent; topic_not_found for a missing/inactive topic
        under an active parent. Applies to new detail endpoints only; existing API error statuses remain unchanged.
      headers:
        Cache-Control:
          $ref: '#/components/headers/DiscoveryNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryErrorResponse'
          example:
            error:
              code: topic_not_found
              message: Topic not found
    DiscoveryUnavailable:
      description: discovery_unavailable when the configured content provider is local/S3 and cannot expose
        PostgreSQL discovery/topic-tag metadata. Existing endpoints/readiness remain usable according to their
        contracts. storage_unavailable when PostgreSQL, its discovery reader contract, publication gate or
        required reader permissions are unavailable or incompatible. Never convert these failures into an
        empty result or 404.
      headers:
        Cache-Control:
          $ref: '#/components/headers/DiscoveryNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryErrorResponse'
          examples:
            unsupportedProvider:
              value:
                error:
                  code: discovery_unavailable
                  message: Discovery unavailable for the configured content provider
            databaseUnavailable:
              value:
                error:
                  code: storage_unavailable
                  message: Storage unavailable
    DiscoveryInternalError:
      description: Unexpected server failure; dependency/contract failures use the explicit 503 response.
      headers:
        Cache-Control:
          $ref: '#/components/headers/DiscoveryNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoveryErrorResponse'
          example:
            error:
              code: internal_error
              message: Internal error

  headers:
    DiscoveryNoStore:
      description: Required on every success and error response; no shared or browser response cache.
      schema:
        type: string
        enum:
        - no-store
