openapi: 3.0.3
info:
  title: QuickQuiz Dev API
  version: 0.4.0
  description: QuickQuiz Dev MVP API.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Catalog
  - name: Session
  - name: Runs
  - name: Solutions
  - name: Discovery
x-discovery-invariants:
  - No administrative token, session ID, or theme/locale header is required.
  - Every operation requires one supported locale query parameter.
  - All success and error responses send Cache-Control no-store.
  - Only active themes and active topics under active themes are visible.
  - Each response reads metadata, tag associations, counts and pagination totals from one short consistent
    database snapshot.
  - Topic-tag edits are visible on the next request after commit without a service restart, independently
    of the gameplay publication revision.
  - Counts use distinct canonical question keys, never translation rows or answer rows, and never reflect
    a player's session consumption.
  - Discovery does not fetch question bodies or expand the complete bank into application memory.
  - New discovery operations return discovery_unavailable in local/S3 mode; existing APIs and readiness
    keep their existing behavior.
paths:
  /readyz:
    get:
      summary: Checks configured runtime dependencies and, in database mode, the PostgreSQL
        contract.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Configured runtime dependencies and contract are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: A configured runtime dependency or contract is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReady'
  /api/themes:
    get:
      operationId: listThemes
      summary: List active published themes
      description: >-
        No theme header, session ID, or administrative token is required.
        Omit tag to list all active themes. Supply exactly one tag for exact
        membership filtering after ASCII whitespace trimming and lowercasing.
        Empty, repeated, invalid, or oversized values return invalid_tag.
        Inactive themes are never returned. Active themes can have no playable
        topics. The response is locale-neutral and ordered by weight, then ID.
      security: []
      parameters:
        - name: tag
          in: query
          required: false
          description: >-
            One classification slug; maximum 50 ASCII bytes before normalization.
            A valid unknown tag produces an empty list. Repetition is invalid.
          schema:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^[ \t\r\n\f\v]*[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*[ \t\r\n\f\v]*$'
          example: dev
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '200':
          description: Active themes matching the optional tag, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeList'
              examples:
                devAudience:
                  value:
                    themes:
                      - id: dev
                        name: Development
                        description: Software development practice
                        weight: 10
                        active: true
                        tags: [dev]
                      - id: kubernetes
                        name: Kubernetes
                        description: Container orchestration practice
                        weight: 20
                        active: true
                        tags: [cloud, dev]
                noMatch:
                  value:
                    themes: []
        '400':
          description: Invalid tag query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidTagError'
              example:
                error:
                  code: invalid_tag
                  message: Invalid tag
  /healthz:
    get:
      tags:
        - Health
      summary: Checks if the API is responding.
      operationId: getHealth
      responses:
        "200":
          description: API is available.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok

  /api/catalog:
    get:
      tags:
        - Catalog
      summary: Lists published topics, metadata, difficulties, and question counts.
      operationId: getCatalog
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Catalog is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/session/reset:
    post:
      tags:
        - Session
      summary: Resets the current session.
      description: Removes tracked runs associated with the provided session header.
      operationId: resetSession
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/SessionID"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Session reset.
          content:
            application/json:
              schema:
                type: object
                required:
                  - reset
                properties:
                  reset:
                    type: boolean
                    example: true
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/session/difficulties:
    get:
      tags:
        - Session
      summary: Lists difficulty availability for the current session and topic.
      description: Counts remaining questions by difficulty using the current session, selected topic, and resolved locale.
      operationId: getSessionDifficulties
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Topic"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Session difficulty availability is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDifficulties"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/session/topics:
    get:
      tags:
        - Session
      summary: Lists topic availability for the current session.
      description: Counts remaining canonical question packages by topic using the current session and resolved locale.
      operationId: getSessionTopics
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Session topic availability is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTopics"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sessions/active:
    get:
      tags:
        - Session
      summary: Lists tracked sessions.
      description: Returns non-expired run sessions visible to the API at request time, including finished runs until session TTL cleanup removes them. This endpoint is open for now and only returns operational metadata.
      operationId: getActiveSessions
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Active sessions are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessions"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs:
    post:
      tags:
        - Runs
      summary: Creates a new run.
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: Run created with the first question.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRunResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "409":
          $ref: "#/components/responses/NoQuestionsLeft"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs/{runId}/answers:
    post:
      tags:
        - Runs
      summary: Answers the current run question.
      operationId: answerRunQuestion
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Answer validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "409":
          description: Run already finished or question does not match current run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs/{runId}/finish:
    post:
      tags:
        - Runs
      summary: Finishes a run manually.
      operationId: finishRun
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/RunID"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Run finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishRunResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs/{runId}/state:
    get:
      tags:
        - Runs
      summary: Gets the current run state.
      description: Returns the public current question when the run is active so clients can reconcile interrupted frontend state.
      operationId: getRunState
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/RunID"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Run state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunState"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs/{runId}/result:
    get:
      tags:
        - Runs
      summary: Gets the final or partial run result.
      operationId: getRunResult
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/RunID"
      responses:
        "503":
          description: Required content/session storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Run result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/RunNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/runs/{runId}/questions/{questionId}/solution:
    get:
      tags:
        - Solutions
      summary: Gets or lazily generates a question solution.
      description: Returns the stored solution for a rejected answer in the requested run. If no fresh solution exists, the API derives topic and difficulty from the run, generates and stores solutions for all supported locales that have the question package, then returns the requested locale.
      operationId: getQuestionSolution
      parameters:
        - $ref: "#/components/parameters/Theme"
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/QuestionID"
      responses:
        "200":
          description: Question solution is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionSolution"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "403":
          $ref: "#/components/responses/SolutionForbidden"
        "404":
          description: Run or question not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/SolutionRateLimited"
        "503":
          $ref: "#/components/responses/SolutionUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/discovery/themes:
    get:
      tags:
      - Discovery
      operationId: discoverThemes
      summary: List active themes and scoped metadata aggregates
      description: q matches canonical theme name or description, not descendant topics. Theme names/descriptions
        are not translated by this feature. themeTag matches the parent theme; topicTag narrows its active
        topics; difficulty narrows canonical question keys. All supplied filters combine with AND. With
        neither topicTag nor difficulty, active empty themes remain visible. topicTag requires at least
        one matching active topic (even if empty). difficulty requires at least one matching question at
        that difficulty. Aggregates include only descendants and questions matching these filters. Results
        are ordered by theme weight ascending, then case-sensitive canonical theme ID in ASCII order. A
        valid unknown tag returns an empty list. The response contains no nested unpaginated topic catalog.
      parameters:
      - $ref: '#/components/parameters/DiscoveryLocale'
      - $ref: '#/components/parameters/DiscoverySearch'
      - $ref: '#/components/parameters/DiscoveryThemeTag'
      - $ref: '#/components/parameters/DiscoveryTopicTag'
      - $ref: '#/components/parameters/DiscoveryDifficulty'
      - $ref: '#/components/parameters/DiscoveryPage'
      - $ref: '#/components/parameters/DiscoveryPageSize'
      responses:
        '200':
          description: Matching themes, including an empty page when there are no matches.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DiscoveryNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryThemePage'
        '400':
          $ref: '#/components/responses/DiscoveryInvalidQuery'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailable'
        '500':
          $ref: '#/components/responses/DiscoveryInternalError'
  /api/discovery/themes/{theme}:
    get:
      tags:
      - Discovery
      operationId: getDiscoveryTheme
      summary: Get an active theme with full active-descendant aggregates
      description: Returns canonical theme metadata, tags and aggregates across all active descendant topics
        and canonical question packages. Active themes without questions return 200 with playable false.
        No listing/search/tag/difficulty filters are accepted here. Read the paginated topic list with theme
        set to this theme ID to obtain its topics. Missing and inactive themes are indistinguishable public
        404 responses.
      parameters:
      - $ref: '#/components/parameters/DiscoveryThemePath'
      - $ref: '#/components/parameters/DiscoveryLocale'
      responses:
        '200':
          description: Active theme metadata; the response does not embed its entire topic list.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DiscoveryNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryThemeDetail'
        '400':
          $ref: '#/components/responses/DiscoveryInvalidQuery'
        '404':
          $ref: '#/components/responses/DiscoveryNotFound'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailable'
        '500':
          $ref: '#/components/responses/DiscoveryInternalError'
  /api/discovery/topics:
    get:
      tags:
      - Discovery
      operationId: discoverTopics
      summary: Discover active topics across themes
      description: q matches the displayed topic label or description after locale fallback; it does not
        match parent names, tag slugs, prompts or answers. theme is an exact case-sensitive parent ID. themeTag
        matches the parent theme and topicTag matches the topic itself. All supplied filters combine with
        AND. Without difficulty, active topics without questions remain visible with playable false. difficulty
        includes only topics with canonical questions at that difficulty and restricts questionCount/difficulties
        to that level. All identity and tag metadata remains complete for a matching resource. Results are
        ordered by topic weight ascending, then canonical theme ID and topic ID in ASCII order. Valid unknown
        theme/tag filters return an empty list; they are not errors and are not missing detail resources.
      parameters:
      - $ref: '#/components/parameters/DiscoveryLocale'
      - $ref: '#/components/parameters/DiscoverySearch'
      - $ref: '#/components/parameters/DiscoveryThemeFilter'
      - $ref: '#/components/parameters/DiscoveryThemeTag'
      - $ref: '#/components/parameters/DiscoveryTopicTag'
      - $ref: '#/components/parameters/DiscoveryDifficulty'
      - $ref: '#/components/parameters/DiscoveryPage'
      - $ref: '#/components/parameters/DiscoveryPageSize'
      responses:
        '200':
          description: Matching topics and their parent identity, possibly empty.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DiscoveryNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTopicPage'
        '400':
          $ref: '#/components/responses/DiscoveryInvalidQuery'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailable'
        '500':
          $ref: '#/components/responses/DiscoveryInternalError'
  /api/discovery/themes/{theme}/topics/{topic}:
    get:
      tags:
      - Discovery
      operationId: getDiscoveryTopic
      summary: Get an active topic within its active parent theme
      description: Returns complete metadata, public topic tags and counts at all populated difficulties
        for this canonical theme/topic pair. Active topics without questions return 200 with questionCount
        0, difficulties [] and playable false. No listing filters are accepted. An inactive/missing parent
        returns theme_not_found; an inactive/missing topic under an active parent returns topic_not_found.
        Both are public 404 responses without disclosing inactive content. Topic IDs are scoped to the canonical
        parent ID.
      parameters:
      - $ref: '#/components/parameters/DiscoveryThemePath'
      - $ref: '#/components/parameters/DiscoveryTopicPath'
      - $ref: '#/components/parameters/DiscoveryLocale'
      responses:
        '200':
          description: Active topic metadata and aggregate availability, without question bodies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DiscoveryNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTopicDetail'
        '400':
          $ref: '#/components/responses/DiscoveryInvalidQuery'
        '404':
          $ref: '#/components/responses/DiscoveryNotFound'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailable'
        '500':
          $ref: '#/components/responses/DiscoveryInternalError'
  /api/discovery/tags:
    get:
      tags:
      - Discovery
      operationId: discoverTags
      summary: List attached public tags with scoped counts
      description: scope selects separate theme or topic tag associations; no inheritance or hierarchy is
        inferred. For scope=theme, q matches canonical theme name/description and the eligible resource
        set follows theme discovery, additionally narrowed by the optional exact theme ID. For scope=topic,
        q matches resolved topic label/description and the eligible resource set follows topic discovery.
        This q searches resource metadata, not tag slugs or the Web's friendly tag labels. Each returned
        tag is attached to at least one eligible active resource. Counts add that candidate tag to all selected
        filters, including any same-scope selected tag; facets are intersecting, not self-excluding. themeCount
        counts distinct eligible parent themes, topicCount counts distinct eligible (theme,topic) pairs,
        and questionCount counts their filtered canonical question packages. For theme scope, counts include
        eligible descendants of themes carrying the candidate theme tag. For topic scope, counts include
        only eligible topics carrying the candidate topic tag. Empty active resources may contribute theme/topic
        counts but never question counts. Orphan tags and inactive associations are absent. Results are
        ordered by canonical slug in ascending ASCII order; tag slugs can exist in both scopes separately.
      parameters:
      - $ref: '#/components/parameters/DiscoveryLocale'
      - $ref: '#/components/parameters/DiscoveryTagScope'
      - $ref: '#/components/parameters/DiscoverySearch'
      - $ref: '#/components/parameters/DiscoveryThemeFilter'
      - $ref: '#/components/parameters/DiscoveryThemeTag'
      - $ref: '#/components/parameters/DiscoveryTopicTag'
      - $ref: '#/components/parameters/DiscoveryDifficulty'
      - $ref: '#/components/parameters/DiscoveryPage'
      - $ref: '#/components/parameters/DiscoveryPageSize'
      responses:
        '200':
          description: Attached tags in the requested scope and filter context, possibly empty.
          headers:
            Cache-Control:
              $ref: '#/components/headers/DiscoveryNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryTagPage'
        '400':
          $ref: '#/components/responses/DiscoveryInvalidQuery'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailable'
        '500':
          $ref: '#/components/responses/DiscoveryInternalError'

components:
  parameters:
    Theme:
      name: X-QuickQuiz-Theme
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        example: dev
      description: Active quiz theme requested by the frontend distribution.
    Locale:
      name: X-QuickQuiz-Locale
      in: header
      required: false
      schema:
        type: string
        example: en-US
      description: BCP 47 content locale. Explicit locale takes precedence over Accept-Language and fallback locale.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: pt-BR,pt;q=0.9,en-US;q=0.8
      description: Browser/client locale preference used only when no explicit locale is provided.
    SessionID:
      name: X-QuickQuiz-Session-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      example: 8dc52f2f-ecbc-448c-a10a-684297c56d8f
    Topic:
      name: topic
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      example: php
    RunID:
      name: runId
      in: path
      required: true
      schema:
        type: string
      example: run_014c27d8d07ed827411d70c1edfdcd96
    QuestionID:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: go-easy-001

    DiscoveryLocale:
      name: locale
      in: query
      required: true
      description: Exactly one configured supported BCP 47 locale, e.g. pt-BR or en-US. Case-insensitive matching
        returns the configured canonical spelling. Missing, empty, repeated, malformed or unsupported values
        return invalid_locale; no Accept-Language or X-QuickQuiz-Locale negotiation is performed on these
        operations. Topic text follows existing field-wise requested translation -> fallback translation ->
        canonical metadata resolution. An explicit empty translated description remains empty. Theme text
        and tag slugs remain canonical and locale-neutral. locale in the response identifies the requested
        supported locale; it does not claim every metadata field has a translation in that locale.
      schema:
        type: string
        minLength: 2
        maxLength: 35
        pattern: ^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*$
      example: pt-BR
    DiscoverySearch:
      name: q
      in: query
      required: false
      description: One UTF-8 search string, maximum 200 Unicode characters / 800 UTF-8 bytes before trimming
        surrounding Unicode whitespace. Omit to disable search; empty, whitespace-only, invalid UTF-8, repeated
        or oversized input returns invalid_query. Match a literal case-insensitive substring of the endpoint's
        described resolved metadata fields; percent and underscore are literal, not wildcard operators. No
        token expansion, accent folding, stemming, question-body search or tag-label translation search is
        implied.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: containers
    DiscoveryThemeFilter:
      name: theme
      in: query
      required: false
      description: Exactly one canonical parent theme ID; case is preserved. Empty, repeated or malformed
        values return invalid_query. A valid unknown/inactive ID produces no list matches. This is a query
        filter, not a theme header.
      schema:
        $ref: '#/components/schemas/DiscoveryIdentifier'
      example: kubernetes
    DiscoveryThemePath:
      name: theme
      in: path
      required: true
      description: Exact canonical theme ID; case-sensitive, without slug rewriting.
      schema:
        $ref: '#/components/schemas/DiscoveryIdentifier'
    DiscoveryTopicPath:
      name: topic
      in: path
      required: true
      description: Exact canonical topic ID within the specified theme; case-sensitive.
      schema:
        $ref: '#/components/schemas/DiscoveryIdentifier'
    DiscoveryThemeTag:
      name: themeTag
      in: query
      required: false
      description: One exact theme-tag membership filter; no inheritance from topic tags. Trim surrounding
        ASCII whitespace and lowercase ASCII letters using the existing Manager/API normalization. Empty,
        repeated, non-ASCII, malformed or raw values longer than 50 ASCII bytes return invalid_tag. A valid
        unknown slug yields no matches. Combine with other filters using AND.
      schema:
        $ref: '#/components/schemas/DiscoveryTagInput'
      example: dev
    DiscoveryTopicTag:
      name: topicTag
      in: query
      required: false
      description: One exact topic-tag membership filter, independent of themeTag. Same normalization and
        validation as themeTag; invalid input returns invalid_tag. A valid unknown slug yields no matches.
        Combine with other filters using AND; a topic need not carry its parent's theme tags.
      schema:
        $ref: '#/components/schemas/DiscoveryTagInput'
      example: seguranca
    DiscoveryDifficulty:
      name: difficulty
      in: query
      required: false
      description: One numeric difficulty. Require canonical questions at that difficulty and narrow questionCount/difficulties
        to that level. Repeated, empty, non-integer or out-of-range values return invalid_query. Existing
        session availability endpoints remain authoritative for a player's remaining questions. No player-specific
        availability is returned here.
      schema:
        $ref: '#/components/schemas/DiscoveryDifficulty'
    DiscoveryTagScope:
      name: scope
      in: query
      required: true
      description: Exactly one association scope; missing, empty, repeated or unknown input returns invalid_query.
      schema:
        type: string
        enum:
        - theme
        - topic
    DiscoveryPage:
      name: page
      in: query
      required: false
      description: One positive integer from 1 through 1000; default 1. Repeated, empty, fractional or out-of-range
        values return invalid_query. A valid page beyond totalPages returns an empty item array with the actual
        totals.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
    DiscoveryPageSize:
      name: pageSize
      in: query
      required: false
      description: One positive integer from 1 through 100; default 24. Repeated, empty, fractional or out-of-range
        values return invalid_query. Never fetch all resources when a page limit was requested or imposed
        by default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24

